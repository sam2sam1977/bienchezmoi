<head>

<style>
/* Layout : colonne d'application façon téléphone, onglets en bas ; sur grand écran, sommaire de démo à gauche */
:root{
  --bg:#ECEFEB; --surface:#FFFFFF; --surface-2:#F4F6F3; --ink:#15252A; --muted:#58686C; --line:#D8DFDA;
  --accent:#1E6B59; --accent-soft:#DCEDE6; --on-accent:#FFFFFF;
  --warm:#DE5B26; --warm-soft:#FBE4D8; --on-warm:#FFFFFF;
  --danger:#B93A27; --danger-soft:#F7DED8; --warn:#9A6514; --warn-soft:#F5E9CF; --ok:#2A7A4B; --ok-soft:#DDEFE2;
  --shadow:0 1px 2px rgba(21,37,42,.06),0 6px 20px rgba(21,37,42,.06);
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162125; --surface-2:#1C292D; --ink:#E6EDEB; --muted:#9BACAE; --line:#2A393E;
  --accent:#5BC1A3; --accent-soft:#17342C; --on-accent:#0E1618; --warm:#F0814F; --warm-soft:#3A2217; --on-warm:#0E1618;
  --danger:#F07462; --danger-soft:#3B1D18; --warn:#E3B45C; --warn-soft:#33291A; --ok:#6CCB8F; --ok-soft:#173222;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162125; --surface-2:#1C292D; --ink:#E6EDEB; --muted:#9BACAE; --line:#2A393E;
  --accent:#5BC1A3; --accent-soft:#17342C; --on-accent:#0E1618; --warm:#F0814F; --warm-soft:#3A2217; --on-warm:#0E1618;
  --danger:#F07462; --danger-soft:#3B1D18; --warn:#E3B45C; --warn-soft:#33291A; --ok:#6CCB8F; --ok-soft:#173222;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:24px} h2{font-size:17px}
p{margin:0}
a{color:var(--accent)}
.shell{display:flex;justify-content:center;gap:32px;min-height:100%}
.side{display:none}
@media (min-width:980px){
  .shell{padding-block:24px}
  .side{display:flex;flex-direction:column;gap:16px;width:270px;position:sticky;top:24px;align-self:flex-start;max-height:calc(100vh - 48px);overflow:auto}
  .app{border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line);min-height:calc(100vh - 48px)}
}
.side .brand{display:flex;align-items:center;gap:10px}
.side h2{font-size:22px}
.side .grp{display:flex;flex-direction:column;gap:2px}
.side .grp p{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--surface);font-weight:700;color:var(--accent)}
.side .tour{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.side .tour ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.app{width:100%;max-width:470px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:clip}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .ttl{flex:1;min-width:0}
.top .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl b{font-family:var(--f-display);font-size:20px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none;color:var(--ink);text-decoration:none}
.iconbtn .dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--warm);color:var(--on-warm);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 0;min-height:48px;justify-content:center}
.tabs a.on{color:var(--accent);font-weight:700}
.tabs a.fab span.c{width:52px;height:52px;margin-top:-26px;border-radius:18px;background:var(--warm);color:var(--on-warm);display:grid;place-items:center;box-shadow:0 6px 16px rgba(222,91,38,.35)}
.tabs a.fab{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h a,.link{font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;text-decoration:none;color:inherit}
.row:first-child{border-top:0}
a.row:hover,button.row:hover{background:var(--surface-2)}
.row .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .b strong{font-weight:700;font-size:15px}
.row .b span{font-size:13px;color:var(--muted)}
.row > svg:last-child{color:var(--muted);flex:none}
.ico{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ico.w{background:var(--warm-soft);color:var(--warm)}
.ico.d{background:var(--danger-soft);color:var(--danger)}
.ico.n{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.legal{background:var(--accent-soft);color:var(--accent)}
.chip.hp{background:var(--warm-soft);color:var(--warm)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid transparent;font-weight:700;font-size:15px;background:var(--accent);color:var(--on-accent);text-decoration:none;text-align:center}
.btn.warm{background:var(--warm);color:var(--on-warm)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns > *{flex:1}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.seg a,.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--muted);text-decoration:none}
.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;text-decoration:none;color:var(--ink);font-weight:700;font-size:13.5px;line-height:1.25;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile span.small{font-weight:500;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.input{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:10px 12px}
textarea.input{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--surface);top:3px;left:3px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{left:21px}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}
.banner{border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.banner.d{background:var(--danger-soft)}
.banner.a{background:var(--accent-soft)}
.banner.w{background:var(--warm-soft)}
.banner > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
.art{flex:none;width:230px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.pic{display:grid;place-items:center;color:var(--ink)}
.art .tx{padding:12px;display:flex;flex-direction:column;gap:4px}
.art .tx b{font-size:14.5px;line-height:1.25}
.hero{background:var(--ink);color:var(--bg);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .muted,.hero .eyebrow{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px}
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .pt{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;z-index:1}
.step.done .pt{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.cur .pt{border-color:var(--warm);background:var(--warm-soft)}
.dpe{display:flex;flex-direction:column;gap:4px}
.dpe div{height:26px;border-radius:0 8px 8px 0;font-weight:800;font-size:13px;display:flex;align-items:center;padding-left:10px;gap:8px;white-space:nowrap}
.dpe div.me{outline:3px solid var(--ink);outline-offset:1px}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--accent)}
.bars span{font-size:10px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.thumb{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:16px;object-fit:cover;background:var(--surface-2);display:block}
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.opt{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--surface);text-align:left;width:100%;cursor:pointer}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:30px;color:var(--line);padding:0}
.stars button.on{color:var(--warm)}
.prose{display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.6}
.prose h4{font-family:var(--f-display);font-size:17px;margin:4px 0 0}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
ul.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:80;max-width:min(420px,calc(100% - 32px));box-shadow:var(--shadow)}
.doc-paper{background:#FFFFFF;color:#1d2a2e;border-radius:12px;border:1px solid var(--line);padding:16px;font-size:12.5px;display:flex;flex-direction:column;gap:10px}
.doc-paper table{width:100%;border-collapse:collapse}
.doc-paper td{padding:4px 0;border-bottom:1px solid #e6e9e7}
.doc-paper td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:24px 12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.foot{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.ov{position:fixed;inset:0;background:rgba(10,18,20,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:470px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@media (min-width:980px){.ov{align-items:center}.sheet{border-radius:24px;max-height:86vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet header h3{flex:1;font-size:18px;min-width:0}
.sheet .bd{overflow:auto;display:flex;flex-direction:column;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12.5px}
.cal span{padding:6px 0;border-radius:9px}
.cal .h{color:var(--muted);font-weight:700;font-size:11px}
.cal .d{background:var(--surface)}
.cal .t{background:var(--ink);color:var(--bg);font-weight:700}
.cal .x{background:var(--warm-soft);color:var(--warm);font-weight:700}
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details.faq summary{font-weight:700;cursor:pointer}
details.faq p{margin-top:8px;font-size:14px;color:var(--muted)}
.plan a{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-top:1px solid var(--line);text-decoration:none;color:inherit;font-size:14px}
.plan a:first-child{border-top:0}
.plan a span{color:var(--muted);font-size:12px;white-space:nowrap}
.room{display:flex;justify-content:space-between;align-items:center;gap:8px}
.floor{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:44px;gap:4px}
.floor div{background:var(--accent-soft);border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;text-align:center;padding:2px;color:var(--ink)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal > *{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.gal img{width:100%;height:100%;object-fit:cover}
.quote{font-size:14px;border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}
</style>

<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="app" id="app">
    <div class="top" id="top"></div>
    <main id="view"></main>
    <nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
  </div>
</div>
<div id="layer"></div>
<input type="file" id="f-photo" accept="image/*" capture="environment" hidden>
<input type="file" id="f-doc" accept="image/*,application/pdf" hidden>
<input type="file" id="f-eqphoto" accept="image/*" hidden>
<input type="file" id="f-gal" accept="image/*" hidden>

<script>
(function(){
'use strict';
/* ================= utilitaires ================= */
const DAY=864e5, T0=new Date(); T0.setHours(12,0,0,0);
const iso=d=>new Date(d).toISOString().slice(0,10);
const ago=n=>iso(T0.getTime()-n*DAY), inD=n=>iso(T0.getTime()+n*DAY), today=()=>iso(T0);
const fmt=(d,o)=>new Date(d).toLocaleDateString('fr-FR',o||{day:'numeric',month:'short',year:'numeric'});
const fmtDM=d=>new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){try{const c=JSON.parse(JSON.stringify(S));c.docs.forEach(d=>delete d.img);c.req.forEach(r=>delete r.photo);c.eq.forEach(q=>delete q.photo);c.photos=[];localStorage.setItem(KEY,JSON.stringify(c));}catch(e2){}}};

function ensureSeason(){const k=seasonNow(); if(S.season.key!==k){S.season={key:k,items:SEASONS[k].items.map(t=>({t,done:false}))}; save();}}
ensureSeason();

/* ================= tâches ================= */
function allTasks(){const o=[];S.eq.forEach(e=>e.tasks.forEach(t=>{const due=addM(t.last,t.every),d=diff(due);o.push({...t,eq:e,due,d,state:d<0?'late':d<=45?'soon':'ok'});}));return o.sort((a,b)=>a.d-b.d);}
const dueTxt=t=>t.d<0?`En retard de ${-t.d} j`:t.d===0?'Aujourd’hui':t.d<=45?`Dans ${t.d} j`:fmt(t.due,{month:'long',year:'numeric'});
const chipFor=t=>`<span class="chip ${t.state}">${dueTxt(t)}</span>`;
function score(){let s=100;allTasks().forEach(t=>{if(t.state==='late')s-=(t.legal&&t.pro)?14:5;else if(t.state==='soon')s-=2;});s+=Math.min(6,S.season.items.filter(i=>i.done).length*2);return Math.max(20,Math.min(100,s));}
function findTask(id){for(const e of S.eq){const t=e.tasks.find(x=>x.id===id);if(t)return{e,t};}return null;}

/* ================= routes ================= */
const R={};
const def=(k,t,g,p,v)=>{R[k]={t,g,p,v};};
const TABS=['accueil','entretien','souci','carnet','mag'];
const cur=()=>{const h=decodeURIComponent(location.hash.slice(1));return resolve(h)?h:'accueil';};
const go=r=>{if(location.hash.slice(1)===r)render();else location.hash=r;};

function resolve(k){
 if(R[k]) return R[k];
 const m=k.match(/^(eq|art|doc|pro|req|obl|diag|saison|aide|metier)-(.+)$/); if(!m) return null;
 const t=m[1],id=m[2];
 if(t==='eq'){const e=S.eq.find(x=>x.id===id);return e&&{t:e.name,g:'Ma maison',p:'maison',v:()=>vEq(e)};}
 if(t==='art'){const a=ART.find(x=>x.id===id);return a&&{t:a.cat,g:'Le mag',p:'mag',v:()=>vArt(a)};}
 if(t==='doc'){const d=S.docs.find(x=>x.id===id);return d&&{t:d.cat,g:'Carnet',p:'carnet',v:()=>vDoc(d)};}
 if(t==='pro'){const p=S.pros.find(x=>x.id===id);return p&&{t:p.name,g:'Artisans',p:'artisans',v:()=>vPro(p)};}
 if(t==='req'){const r=S.req.find(x=>x.id===id);return r&&{t:r.title,g:'Demandes',p:'demandes',v:()=>vReq(r)};}
 if(t==='obl'){const o=OBL[id];return o&&{t:o.t,g:'Entretien',p:'obligations',v:()=>vObl(id,o)};}
 if(t==='diag'){const d=DIAG[id];return d&&{t:'Dépannage · '+d.t,g:'Un souci',p:'depannage',v:()=>vDiag(id,d)};}
 if(t==='saison'){const s=SEASONS[id];return s&&{t:s.name,g:'Entretien',p:'saison',v:()=>vSeason(id,s)};}
 if(t==='aide'){const a=AIDES[id];return a&&{t:a.t,g:'Énergie',p:'aides',v:()=>vAide(a)};}
 if(t==='metier'){const mm=METIERS[id];return mm&&{t:mm.t,g:'Artisans',p:'annuaire',v:()=>vMetier(id,mm)};}
 return null;
}
function allRoutes(){
 const o=Object.keys(R).map(k=>[k,R[k].t,R[k].g]);
 S.eq.forEach(e=>o.push(['eq-'+e.id,e.name,'Ma maison']));
 Object.entries(OBL).forEach(([k,v])=>o.push(['obl-'+k,v.t,'Entretien']));
 Object.entries(SEASONS).forEach(([k,v])=>o.push(['saison-'+k,'Saison · '+v.name,'Entretien']));
 Object.entries(DIAG).forEach(([k,v])=>o.push(['diag-'+k,'Dépannage · '+v.t,'Un souci']));
 S.req.forEach(r=>o.push(['req-'+r.id,'Demande · '+r.title,'Demandes']));
 S.docs.forEach(d=>o.push(['doc-'+d.id,d.title,'Carnet']));
 Object.entries(AIDES).forEach(([k,v])=>o.push(['aide-'+k,v.t,'Énergie']));
 S.pros.forEach(p=>o.push(['pro-'+p.id,p.name,'Artisans']));
 Object.entries(METIERS).forEach(([k,v])=>o.push(['metier-'+k,v.t,'Artisans']));
 ART.forEach(a=>o.push(['art-'+a.id,a.t,'Le mag']));
 return o;
}

function offersFor(t,e){const base={'ch-ent':129,'cl-ent':159,'in-ram':75}[t.id]||120;return[{pro:e.pro||'Thermique Océan',note:4.7,price:base,tag:'Votre artisan habituel'},{pro:t.id==='in-ram'?'Ramonage Express 17':'Atelier Martin Chauffage',note:4.8,price:base-10,tag:'RGE'},{pro:t.id==='in-ram'?'Les Ramoneurs d’Aunis':'Énergies Charentaises',note:4.5,price:base+10,tag:''}];}

function readImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72));};im.onerror=()=>cb(null);im.src=r.result;};r.onerror=()=>cb(null);r.readAsDataURL(file);}
function samplePhoto(){const c=document.createElement('canvas');c.width=640;c.height=480;const g=c.getContext('2d');g.fillStyle='#d9d2c4';g.fillRect(0,0,640,480);g.fillStyle='#7a5a3a';g.fillRect(0,300,640,180);g.fillStyle='#b9b3a8';g.fillRect(200,120,240,180);g.strokeStyle='#e8e4dc';g.lineWidth=18;g.beginPath();g.moveTo(320,60);g.lineTo(320,200);g.quadraticCurveTo(320,250,380,250);g.lineTo(460,250);g.stroke();const gr=g.createRadialGradient(330,360,10,330,360,140);gr.addColorStop(0,'rgba(40,60,70,.65)');gr.addColorStop(1,'rgba(40,60,70,0)');g.fillStyle=gr;g.fillRect(150,280,360,200);g.fillStyle='rgba(120,170,200,.8)';for(let i=0;i<5;i++){g.beginPath();g.arc(330+i*4,262+i*14,5,0,7);g.fill();}return c.toDataURL('image/jpeg',.8);}

 onbAdr(){const a=$('#onb-adr'),s=$('#onb-st');if(a&&a.value.trim())S.house.address=a.value.trim();if(s)S.house.status=s.value;save();go('onb-logement');},
 onbEq(b){UI.onbEq[+b.dataset.i]=b.checked?1:0;render();},
 saveProfil(){['first','last','email','phone'].forEach(k=>{const v=$('#pf-'+k).value.trim();if(v)S.user[k]=v;});save();toast('Profil enregistré');go('compte');},
 addHome(){const n=$('#lg-n').value.trim(),a=$('#lg-a').value.trim();if(!n||!a){toast('Indiquez le nom et l’adresse');return;}S.homes.push({name:n,address:a});save();render();toast('Logement ajouté');},
 addMember(){const n=$('#fy-n').value.trim();if(!n){toast('Indiquez un nom ou un e-mail');return;}S.household.push({n,r:'Invitation envoyée'});save();render();},
 simRev(b){UI.sim.rev=b.dataset.k;render();}, simTr(b){const k=b.dataset.k,l=UI.sim.travaux;UI.sim.travaux=l.includes(k)?l.filter(x=>x!==k):[...l,k];render();},
 reset(){sheet('Remettre la démo à zéro ?',`<p>Vos ajouts dans cette démo (demandes, documents, coches) seront effacés.</p><button class="btn full danger" data-a="resetOk">Remettre à zéro</button><button class="btn full ghost" data-a="close">Annuler</button>`);},
 resetOk(){S=seed();ensureSeason();UI.souci={photo:null,cat:null,desc:''};save();closeSheet();go('accueil');toast('Démo remise à zéro');}
};

/* ================= évènements ================= */
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');
 if(b){const fn=A[b.dataset.a];if(fn){if(b.dataset.a==='closeOv'){fn(b,ev);return;}const tag=b.tagName;if(!(tag==='A'||tag==='LABEL'||tag==='INPUT'))ev.preventDefault();fn(b,ev);}}
 const a=ev.target.closest('a[href^="#"]');if(a&&$('#layer').contains(a))closeSheet();
});
document.addEventListener('input',ev=>{const k=ev.target.dataset.in;if(!k)return;
 if(k==='souciDesc'){UI.souci.desc=ev.target.value;return;}
 if(k==='docQ'||k==='q'){UI[k]=ev.target.value;const p=ev.target.selectionStart,id=ev.target.id;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(p,p);}}});
document.addEventListener('change',ev=>{const t=ev.target,f=t.files&&t.files[0];if(!f)return;
 if(t.id==='f-photo')readImg(f,src=>{if(!src){toast('Ce fichier n’est pas une image lisible');return;}UI.souci.photo=src;render();});
 if(t.id==='f-doc'){const cat=($('#ad-c')||{}).value||(f.type.startsWith('image/')?'Photos':'Factures'),eq=($('#ad-e')||{}).value||undefined;const add=img=>{S.docs.push({id:uid('d'),cat,title:f.name.replace(/\.[^.]+$/,''),date:today(),src:'Vous',by:'Ajout manuel',eq,img:img||undefined});save();UI.docCat='Tous';toast('Document ajouté au carnet');go('carnet');};if(f.type.startsWith('image/'))readImg(f,add);else add(null);}
 if(t.id==='f-eqphoto')readImg(f,src=>{if(!src)return;if(UI.eqPhoto==='new'){UI.newEqPhoto=src;toast('Photo de la plaque ajoutée');return;}const e=S.eq.find(x=>x.id===UI.eqPhoto);if(e){e.photo=src;save();render();toast('Plaque enregistrée');}});
 if(t.id==='f-gal')readImg(f,src=>{if(src){S.photos.unshift(src);save();render();toast('Photo ajoutée');}});
 t.value='';});
document.addEventListener('submit',ev=>{if(ev.target.id==='chat-f'){ev.preventDefault();sendChat($('#chat-in').value);setTimeout(()=>{const n=$('#chat-in');if(n)n.focus();},40);}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#layer').innerHTML)closeSheet();});
let last=cur();
window.addEventListener('hashchange',()=>{const r=cur();if(r!==last){window.scrollTo(0,0);last=r;}closeSheet();render();});
render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
